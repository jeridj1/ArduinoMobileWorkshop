name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          check-latest: true
      - name: Build Android Arduino CLI
        id: build_cli
        continue-on-error: true
        timeout-minutes: 20
        run: |
          git clone --depth 1 https://github.com/ipodvideo87/arduino-cli-android.git /tmp/arduino-cli-android
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd /tmp/arduino-cli-android
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -buildvcs=false -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libarduino-cli.so" .
          chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libarduino-cli.so"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: |
          ./gradlew clean assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace --continue --no-daemon 2>&1 | tee -a build.log
      - name: Build release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee -a build.log
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArduinoMobileWorkshop-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ArduinoMobileWorkshop-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
      - name: Report build failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_OUTCOME: ${{ steps.build_cli.outcome }}
        run: |
          set -e
          ERRORS="$(grep -E '^e: ' build.log || true)"
          OTHER="$(grep -Ei 'error:|FAILED' build.log | grep -vE '^e: ' || true)"
          TAIL="$(tail -n 120 build.log || true)"
          {
            echo "CI build failed on commit ${GITHUB_SHA::7} (${GITHUB_SHA})."
            echo
            if [ "$CLI_OUTCOME" = "failure" ]; then
              echo "Note: the arduino-cli Go cross-compile step failed or timed out (continue-on-error); the APK build below ran independently."
              echo
            fi
            echo "Kotlin compiler errors:"
            echo '```'
            printf '%s\n' "$ERRORS"
            echo '```'
            echo
            echo "Other notable lines:"
            echo '```'
            printf '%s\n' "$OTHER"
            echo '```'
            echo
            echo "Last ~120 lines of the Gradle build log:"
            echo '```'
            printf '%s\n' "$TAIL"
            echo '```'
            echo
            echo "Failed workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/issue_body.md
          gh issue create --title "CI build failed: ${GITHUB_SHA::7}" --body-file /tmp/issue_body.md --label ci-failure
