name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # arduino-cli-android's go.mod requires Go >= 1.26.1. Pin to the
          # latest stable release so the cross-compile step resolves.
          go-version: '1.26.1'
          check-latest: true
      - name: Build Android Arduino CLI
        run: |
          git clone --depth 1 https://github.com/ipodvideo87/arduino-cli-android.git /tmp/arduino-cli-android
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd /tmp/arduino-cli-android
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -buildvcs=false -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libarduino_cli.so" .
          chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libarduino_cli.so"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArduinoMobileWorkshop-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
